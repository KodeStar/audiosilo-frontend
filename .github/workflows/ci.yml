# Gates every pull request and push to main on the Expo SDK pins, one copy of each native
# module, typecheck + lint + format (prettier --check) + tests.
# The web-export image build (web.yml) stays separate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exits non-zero when a package drifts from the version the Expo SDK pins.
      # expo.install.exclude in package.json keeps the deliberate drift out
      # (async-storage; CONVENTIONS.md, Dependency patches).
      - name: Expo SDK pins
        run: npx expo install --check

      # A second installed copy of react, react-native, a native module or
      # expo-modules-core passes the check above and can still crash on a device.
      - name: No nested native modules
        run: node scripts/check-native-dupes.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Unused files, exports and dependencies (knip, knip.json), reported for a reviewer to
      # read: not a gate yet, today's findings are not all cleared (fe#161).
      - name: Unused code (report only)
        run: npm run knip -- --no-exit-code

      - name: Format
        run: npm run format

      # src/api/__wire__ is a byte copy of the server's wire goldens at the commit
      # source.json pins; the parity test (in Test) checks types.ts against it.
      - name: Wire goldens match the pinned server commit
        run: npm run wire:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        run: npm test -- --ci --coverage
