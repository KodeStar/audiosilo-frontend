# The Wear OS app (Track W4, decision 14): its pure Kotlin core (wear-core/) tested on the JVM,
# then the Android build after a prebuild. `:app` is built too: React Native's root plugin makes
# `:app:preBuild` depend on `:wear:preBuild`, so a broken `:wear` breaks the phone build.
name: wear

on:
  pull_request:
    paths:
      - 'wear/**'
      - 'wear-core/**'
      - 'plugins/withWearApp.js'
      - 'scripts/test-wear.sh'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wear.yml'
  push:
    branches: [main]
    paths:
      - 'wear/**'
      - 'wear-core/**'
      - 'plugins/withWearApp.js'
      - 'scripts/test-wear.sh'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wear.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Test the Wear core
        run: sh scripts/test-wear.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild -p android --no-install

      - name: Build and test the Wear app, and build the phone app
        working-directory: android
        run: ./gradlew --console=plain :wear:assembleDebug :wear:testDebugUnitTest :app:assembleDebug
