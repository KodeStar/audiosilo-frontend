version: 2

# Keep the dependency surfaces this repo actually has fresh, without turning the
# pull request list into a dependency feed. Minor and patch updates are GROUPED
# into one pull request per ecosystem per week - they are the bulk of the
# traffic and are reviewed as one bump either way - while a major update still
# arrives on its own, because that is the one that needs reading.
#
# Not configured: docker (Dockerfile.web is FROM scratch, nothing to update)
# and scripts/glyphs (an optional generator with no lockfile, whose packages
# come from FontAwesome's private registry).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # This is an Expo SDK app: the SDK pins the versions of these packages -
      # its native modules, and react, typescript, jest and their types
      # (`npx expo install --check` reports any drift) - and a native module
      # bumped past its pin can build and still crash on a device. Patch
      # releases inside the pin are fine; minor and major moves happen only as
      # part of an Expo SDK upgrade, done with `npx expo install --fix` - never
      # by dependabot. The packages the SDK pins to an EXACT version (react,
      # react-dom, react-native, reanimated, svg, worklets - see
      # node_modules/expo/bundledNativeModules.json) are ignored outright, patches
      # included: React Native's renderer is built against one exact react, and
      # dependabot moving react 19.2.3 -> 19.2.8 inside a "patch" group is how
      # that broke. react-test-renderer follows the react the SDK pins and is
      # ignored outright with it; async-storage (a native module already past
      # the SDK's 2.x) takes patches only. Named one by one rather than
      # `react-native-*`, which would also freeze react-native-marked (plain
      # JS); add a native module here when one is added.
      - dependency-name: expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: expo-*
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@expo/*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: jest-expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: eslint-config-expo
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      - dependency-name: '@types/react'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native-screens
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native-svg
      - dependency-name: react-native-web
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: react-native-worklets
      - dependency-name: '@react-native-async-storage/async-storage'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: jest
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: '@types/jest'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Uniwind compiles with the @tailwindcss/node it pins exactly (4.3.3 for
      # uniwind 1.12), which pins its own tailwindcss; the top-level tailwindcss
      # only supplies the theme/preflight/utilities CSS that src/global.css
      # imports, and must stay on that same version. A uniwind bump moves both
      # (npm hoists the new pin); a tailwindcss bump on its own - patches too:
      # the 4.3.3 change that needed uniwind 1.12 was a patch - only splits them.
      # So it is ignored outright and moves with uniwind.
      - dependency-name: tailwindcss

  # The workflows reference actions by major tag (actions/checkout@v4), so the
  # only update for them is the next major, which arrives on its own.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
